name: Build Windows portable release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ditasha-sorter-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/engine.test.cjs
      - run: node tests/large-io.test.cjs
      - run: node tests/preview.test.cjs
      - run: npm run build:win
      - run: node scripts/verify-package.cjs
      - name: Verify desktop UI, native ZIP export and multi-model preview on Windows
        run: npx electron tests/smoke.cjs
        timeout-minutes: 3
      - run: node scripts/checksum.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DITASHA-Asset-Sorter-Windows-x64
          path: |
            release/DITASHA-Asset-Sorter.exe
            release/DITASHA-Asset-Sorter.exe.sha256
      - name: Publish portable EXE and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag must match package.json version.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping it unchanged."; exit 0 }
          gh release create $tag release/DITASHA-Asset-Sorter.exe release/DITASHA-Asset-Sorter.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DITASHA Asset Sorter $version" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
