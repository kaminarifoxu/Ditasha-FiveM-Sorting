name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "Ditasha-FiveM-Sorting" app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ditasha-FiveM-Sorting-Windows
          path: dist/Ditasha-FiveM-Sorting.exe

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ditasha-FiveM-Sorting.exe
          generate_release_notes: true
